<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔐 密件公文傳遞簽收系統</title>
    <style>
        :root {
            --primary-red: #d32f2f;
            --dark-bg: #263238;
            --light-grey: #f4f7f6;
        }
        body { font-family: "Microsoft JhengHei", sans-serif; background: var(--light-grey); margin: 0; padding: 20px; }
        .container { max-width: 1100px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        
        /* 標題區 */
        h1 { color: var(--dark-bg); border-left: 8px solid var(--primary-red); padding-left: 15px; margin-bottom: 30px; }
        
        /* 錄入區塊 (對應手稿上半部) */
        .input-section { background: #fff5f5; border: 1px solid #ffcdd2; padding: 20px; border-radius: 10px; margin-bottom: 30px; display: flex; flex-wrap: wrap; gap: 15px; align-items: flex-end; }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { font-weight: bold; margin-bottom: 5px; color: #555; }
        input { padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 16px; width: 200px; }
        input:focus { border-color: var(--primary-red); outline: none; box-shadow: 0 0 5px rgba(211, 47, 47, 0.2); }
        button { padding: 12px 25px; background: var(--primary-red); color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.3s; }
        button:hover { background: #b71c1c; transform: translateY(-2px); }

        /* 表格區塊 (對應手稿下半部) */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: white; }
        th { background: var(--dark-bg); color: white; padding: 15px; text-align: left; }
        td { padding: 15px; border-bottom: 1px solid #eee; color: #333; }
        tr:hover { background-color: #f9f9f9; }

        /* 狀態標籤 */
        .status { padding: 6px 12px; border-radius: 20px; font-size: 14px; font-weight: bold; }
        .waiting { background: #fff3e0; color: #ef6c00; border: 1px solid #ffe0b2; }
        .received { background: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; }
        
        .auto-hint { font-size: 12px; color: #888; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🔐 密件公文傳遞簽收表</h1>

    <div class="input-section">
        <div class="form-group">
            <label>收文號</label>
            <input type="text" id="doc_id" placeholder="例如: 1120001" autofocus>
        </div>
        <div class="form-group">
            <label>承辦人姓名</label>
            <input type="text" id="assignee" placeholder="輸入姓名">
        </div>
        <div class="form-group">
            <label>承辦人 ID (條碼)</label>
            <input type="text" id="user_id" placeholder="掃描識別證">
        </div>
        <button onclick="submitDoc()">確認登錄</button>
        <div class="auto-hint">* 登錄時間將由系統自動產生</div>
    </div>

    <h3>📋 公文簽收追蹤清單</h3>
    <table>
        <thead>
            <tr>
                <th>收文號</th>
                <th>承辦人</th>
                <th>登錄時間</th>
                <th>領取時間</th>
                <th>領取人</th>
                <th>狀態</th>
            </tr>
        </thead>
        <tbody id="docList">
            </tbody>
    </table>
</div>

<script>
    // 載入清單資料
    async function fetchDocs() {
        try {
            const res = await fetch('/api/doc_list');
            const data = await res.json();
            const list = document.getElementById('docList');
            
            list.innerHTML = data.map(d => `
                <tr>
                    <td><strong>${d.doc_id}</strong></td>
                    <td>${d.assignee}</td>
                    <td>${d.login_time}</td>
                    <td>${d.collection_time || '---'}</td>
                    <td>${d.receiver_name || '---'}</td>
                    <td>
                        <span class="status ${d.is_collected ? 'received' : 'waiting'}">
                            ${d.is_collected ? '● 已簽收' : '○ 待領取'}
                        </span>
                    </td>
                </tr>
            `).join('');
        } catch (err) {
            console.error("載入失敗:", err);
        }
    }

    // 提交新公文
    async function submitDoc() {
        const doc_id = document.getElementById('doc_id').value;
        const assignee = document.getElementById('assignee').value;
        const user_id = document.getElementById('user_id').value;

        if (!doc_id || !assignee || !user_id) {
            alert("請完整填寫所有欄位！");
            return;
        }

        const res = await fetch('/api/add_doc', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ doc_id, assignee, user_id })
        });

        if (res.ok) {
            // 清空輸入框
            document.getElementById('doc_id').value = '';
            document.getElementById('assignee').value = '';
            document.getElementById('user_id').value = '';
            document.getElementById('doc_id').focus();
            fetchDocs(); // 重新整理清單
        } else {
            alert("錄入失敗，可能收文號已重複！");
        }
    }

    // 每 3 秒自動更新一次清單 (模擬即時監控)
    setInterval(fetchDocs, 3000);

    // 初始載入
    fetchDocs();
</script>

</body>
</html>
